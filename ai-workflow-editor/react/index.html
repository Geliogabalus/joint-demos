  <meta charset="UTF-8" />

  <!-- Primary meta -->
  <title>AI Workflow Builder — Visual AI Agents, Tools & Skills | JointJS</title>
  <meta name="description"
    content="AI Workflow Builder is a node-based demo built with @joint/react-plus (JointJS). Visually design, connect, and run AI agents, tools, and skills on an interactive drag-and-drop canvas." />

  <meta name="robots" content="index,follow" />
  <link rel="canonical" href="https://www.jointjs.com/" />

  <!-- Theme color -->
  <meta name="theme-color" content="#1a1416" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1416" />
  <meta name="color-scheme" content="dark light" />

  <!-- Apply the OS colour scheme before first paint. Without this, useTheme adds
       `.dark` in an effect (post-paint) → a flash of light theme AND Chrome leaves
       `transition-colors` elements stuck on the stale light colour (fails contrast).
       Mirrors useTheme's systemTheme(); useTheme keeps it live after mount. -->
  <script>
    try {
      if (matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark");
      }
    } catch (_) {}
  </script>
